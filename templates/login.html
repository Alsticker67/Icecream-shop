{% load static %}
<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Ice Creams $hop</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍦</text></svg>">
    <style>
      @import "https://use.fontawesome.com/releases/v5.5.0/css/all.css";
body{
  margin: 0;
  padding: 0;
  font-family: sans-serif;
  min-height: 100vh;
  background: url("{% static 'bg.jpg' %}") center / cover no-repeat;
}
.login-box{
  width: 280px;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  color:#fff
}
.login-box h1{
  float: left;
  font-size: 40px;
  border-bottom: 6px solid #4caf50;
  margin-bottom: 50px;
  padding: 13px 0;
}
.textbox{
  width: 100%;
  overflow: hidden;
  font-size: 20px;
  padding: 8px 0;
  margin: 8px 0;
  border-bottom: 1px solid #4caf50;
}
.textbox i{
  width: 26px;
  float: left;
  text-align: center;
}
.textbox input{
  border: none;
  outline: none;
  background: none;
  color: #fff;
  font-size: 18px;
  width: 80%;
  float: left;
  margin: 0 10px;
}
.btn{
  width: 100%;
  background: none;
  border: 2px solid #4caf50;
  color:#fff;
  padding: 5px;
  font-size: 18px;
  cursor: pointer;
  margin: 12px 0;
}
.back-link{
  display: block;
  text-align: center;
  color: #fff;
  text-decoration: none;
}
.back-link:hover{
  color: #4caf50;
}
.btn:hover{
 
  background:#4caf50;;
 
  
  
}
  </style>

  </head>
  <body>
      <form class="form-signin" method="post" action="/login">
        {% csrf_token %}  
<div class="login-box">
  <h1>Login</h1>
  {% for message in messages %}
    <p style="clear: both; color: #ff6b6b;">{{ message }}</p>
  {% endfor %}
  <div class="textbox">
    <i class="fas fa-user"></i>
    <input type="text" name="username"placeholder="Username">
  </div>

  <div class="textbox">
    <i class="fas fa-lock"></i>
    <input type="password" id="inputPassword" name="password" class="form-control"   placeholder="Password">
  </div>
    <button class="btn btn-lg btn-primary btn-block" type="submit">Sign in</button>
    <a class="back-link" href="/">&larr; Back to home</a>
</div>
</form>


  </body>
</html>
