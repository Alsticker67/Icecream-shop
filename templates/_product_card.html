{% load static humanize %}
<div class="card product-card h-100 shadow-sm">
    {% if product.image %}
    <img src="{% static product.image %}" class="card-img-top" alt="{{ product.name }}">
    {% else %}
    <div class="card-img-top card-img-icon"><i class="{{ product.icon|default:category.icon }}"></i></div>
    {% endif %}
    <div class="card-body d-flex flex-column">
        <div class="d-flex justify-content-between align-items-start">
            <h5 class="card-title mb-2">{{ product.name }}</h5>
            {% if product.size %}<span class="badge badge-warning ml-2 text-nowrap">{{ product.size }}</span>{% endif %}
        </div>
        <p class="card-text text-muted">{{ product.desc }}</p>
        <div class="d-flex justify-content-between align-items-center mt-auto">
            <span class="price">{% if product.from_price %}<small>From </small>{% endif %}&#8377;{{ product.price|intcomma }}</span>
            <a href="/contact" class="btn btn-sm btn-outline-dark">{% if product.from_price %}Enquire{% else %}Order{% endif %}</a>
        </div>
    </div>
</div>
